# Dev environment overrides (lives in agentbox-gitops, not the app repo).
#
# This file is the GitOps handoff point: the app repo's CI writes the image tag
# of every main-branch build here (see .github/workflows/ci.yml, deploy-dev job),
# and ArgoCD converges the dev cluster to match. Humans don't edit `image.tag`.
# Everything else in this file is owned by humans, via pull request.

image:
  repository: ghcr.io/kay-bluhuntr/agentbox
  tag: "8d8344f77b576f9d9ec8748b1a0648f64841b746"  # managed by CI — do not edit by hand

replicaCount: 1  # dev: one replica is plenty; leader election still exercised

execNamespace: agentbox-exec-dev

# Smaller blast radius in dev: tighter aggregate quota on the exec namespace.
execQuota:
  pods: "20"
  requestsCpu: "4"
  requestsMemory: 8Gi
  limitsCpu: "8"
  limitsMemory: 16Gi
