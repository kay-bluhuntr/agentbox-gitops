# Production environment overrides (lives in agentbox-gitops, not the app repo).
#
# Promotion is a pull request: run `scripts/promote.sh` in the app repo to copy
# the tag currently running in dev into this file, then open a PR against this
# repo. The diff *is* the change record — what's deploying, who approved it, and
# when. ArgoCD applies it on merge; nobody runs helm against prod by hand.

image:
  repository: ghcr.io/kay-bluhuntr/agentbox
  tag: "initial"  # promoted from dev via PR — see scripts/promote.sh

replicaCount: 2  # HA control plane; reconciler leader-elects via Postgres

execNamespace: agentbox-exec

execQuota:
  pods: "50"
  requestsCpu: "10"
  requestsMemory: 20Gi
  limitsCpu: "20"
  limitsMemory: 40Gi

# Prod runs the full platform pattern: scraped, alerted, and shipped via canary.
# These assume the Prometheus Operator and Argo Rollouts controller are present.
metrics:
  serviceMonitor:
    enabled: true
    labels: {release: kube-prometheus-stack}

monitoring:
  prometheusRule:
    enabled: true
    labels: {release: kube-prometheus-stack}

# Canary the control plane: a bad release only reaches canaryWeight% of traffic
# and is auto-rolled-back if the AnalysisTemplate sees reconcile errors or
# latency regress. Dev deliberately skips this — fast iteration over safety.
rollout:
  enabled: true
  canaryWeight: 20
  pauseDuration: 120s
